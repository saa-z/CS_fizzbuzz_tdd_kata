[project]
name = "fizzbuzz-tdd-kata"
version = "0.1.0"
description = "A TDD kata: FizzBuzz, from notebook exploration to a tested, published package"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Salwa Azariouh", email = "salwaazariouh@gmail.com" }
]
requires-python = ">=3.11"
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["src/fizzbuzz_tdd_kata"]

[project.scripts]
fizzbuzz-tdd-kata = "fizzbuzz_tdd_kata:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

# ---- Adding ruff checks
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# pyflakes, pycodestyle, isort, pyupgrade, bugbear

[tool.ruff.lint.per-file-ignores]
# marimo cells intentionally end on a bare expression to define what the cell displays — that pattern is exactly what flake8-bugbear's B018# ("useless expression") flags, so it's disabled for notebook files.
"notebooks/*.py" = ["B018"]

[tool.mypy]
strict = true
files = ["src"]

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
show_missing = true
fail_under = 90
# ---- ruff checks

[dependency-groups]
dev = [
    "marimo>=0.10",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "pytest>=8.0",
    "mypy>=2.3.1",
    "matplotlib>=3.11.2",
]
